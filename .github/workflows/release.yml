name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]   # dry-run: build only, no upload

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: shadowforge

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v7.0.0

      # The tag, the crate version, the VERSION file and the changelog all
      # have to agree. Nothing else enforces it, and a mismatch is only
      # visible after the artifact has been published.
      - name: Check version consistency
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release.py check --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/release.py check
          fi

      - name: Resolve release name
        id: version
        run: |
          VERSION="$(python3 scripts/release.py version)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="$GITHUB_REF_NAME"
          else
            NAME="$VERSION"
          fi
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_NAME: ${{ needs.verify.outputs.release_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            pdfium_asset: pdfium-linux-x64.tgz

          # Linux arm64 (cross-compile)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            pdfium_asset: pdfium-linux-arm64.tgz
            cross: true

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            runner: macos-latest    # M-series runner
            archive_ext: tar.gz
            pdfium_asset: pdfium-mac-arm64.tgz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_ext: zip
            pdfium_asset: pdfium-win-x64.tgz

          # macOS Intel  — cross-compiled from macos-latest (ARM) runner.
          # macos-13 (Intel) was retired by GitHub; Apple's LLVM toolchain
          # on ARM natively supports the x86_64-apple-darwin target.
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive_ext: tar.gz
            pdfium_asset: pdfium-mac-x64.tgz
            cross: true

          # Windows ARM64 — Tier 1 as of Rust 1.91.
          # Uses the native windows-11-arm runner to avoid needing the MSVC
          # ARM64 cross-compiler component which is not present on the
          # standard windows-latest (x86_64) runner.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive_ext: zip
            pdfium_asset: pdfium-win-arm64.tgz

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-compiling only)
        if: matrix.cross && runner.os == 'Linux'
        run: cargo install cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install pdfium
        shell: bash
        run: |
          curl -L "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}" | tar xz
          if [[ ! -d "$(pwd)/lib" ]]; then
            echo "pdfium library directory was not extracted" >&2
            exit 1
          fi
          echo "PDFIUM_DYNAMIC_LIB_PATH=$(pwd)/lib" >> $GITHUB_ENV
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$(pwd)/lib" >> $GITHUB_PATH
          fi

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Build (cross Linux)
        if: matrix.cross && runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }} --all-features

      - name: Build (cross macOS — native toolchain)
        if: matrix.cross && runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Generate shell completions (native)
        if: "!matrix.cross || runner.os == 'macOS'"
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            BIN="${BIN}.exe"
          fi
          mkdir -p completions
          "$BIN" completions bash   -o completions/shadowforge.bash
          "$BIN" completions zsh    -o completions/_shadowforge
          "$BIN" completions fish   -o completions/shadowforge.fish
          "$BIN" completions powershell -o completions/_shadowforge.ps1

      - name: Generate shell completions (cross — Linux only, runs on host)
        if: matrix.cross && runner.os == 'Linux'
        shell: bash
        run: |
          # Cross-compiled Linux binary can't run on the host; build a host binary
          mkdir -p completions
          cargo run --release -- completions bash   -o completions/shadowforge.bash
          cargo run --release -- completions zsh    -o completions/_shadowforge
          cargo run --release -- completions fish   -o completions/shadowforge.fish
          cargo run --release -- completions powershell -o completions/_shadowforge.ps1

      # Everything lands in dist/, whose name does not depend on the
      # platform, so the release job can merge the archives from every
      # matrix leg without knowing where each one came from.
      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          ARCHIVE="${{ env.BINARY_NAME }}_${{ env.RELEASE_NAME }}_${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "$BIN" .
          tar czf "dist/$ARCHIVE" "${{ env.BINARY_NAME }}" completions/ README.md LICENSE

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $BIN = "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe"
          $ARCHIVE = "${{ env.BINARY_NAME }}_${{ env.RELEASE_NAME }}_${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $BIN .
          Compress-Archive -Path "${{ env.BINARY_NAME }}.exe","completions","README.md","LICENSE" -DestinationPath "dist/$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Collect release artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      # A single checksum file over every archive, so a user can verify a
      # download with one command instead of one per platform.
      - name: Generate checksums
        run: |
          cd dist
          python3 - <<'PYEOF'
          import hashlib
          import pathlib

          archives = sorted(
              p for p in pathlib.Path(".").iterdir()
              if p.suffix in (".gz", ".zip")
          )
          if not archives:
              raise SystemExit("error: no release archives were collected")

          with open("SHA256SUMS", "w", encoding="utf-8") as sums:
              for archive in archives:
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  sums.write(f"{digest}  {archive.name}\n")
                  print(f"{digest}  {archive.name}")
          PYEOF

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## shadowforge ${GITHUB_REF_NAME}"
            echo
            python3 scripts/release.py notes "$VERSION" || echo "_Full details in the project changelog._"
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.1
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: [verify, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Dry-run publish
        run: cargo publish --package shadowforge --dry-run

      - name: Check version not already published
        id: version_check
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="shadowforge") | .version')
          if cargo search shadowforge --limit 1 2>/dev/null | grep -q "shadowforge = \"${VERSION}\""; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already on crates.io — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version_check.outputs.already_published != 'true'
        run: cargo publish --package shadowforge
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
