name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]   # dry-run: build only, no upload

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: shadowforge

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      ASSET: ""   # set by Package steps at runtime; declared here to satisfy static analysis
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            pdfium_asset: pdfium-linux-x64.tgz

          # Linux arm64 (cross-compile)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            pdfium_asset: pdfium-linux-arm64.tgz
            cross: true

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            runner: macos-latest    # M-series runner
            archive_ext: tar.gz
            pdfium_asset: pdfium-mac-arm64.tgz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_ext: zip
            pdfium_asset: pdfium-win-x64.tgz

          # macOS Intel  — cross-compiled from macos-latest (ARM) runner.
          # macos-13 (Intel) was retired by GitHub; Apple's LLVM toolchain
          # on ARM natively supports the x86_64-apple-darwin target.
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive_ext: tar.gz
            pdfium_asset: pdfium-mac-x64.tgz
            cross: true

          # Windows ARM64 — Tier 1 as of Rust 1.91.
          # Uses the native windows-11-arm runner to avoid needing the MSVC
          # ARM64 cross-compiler component which is not present on the
          # standard windows-latest (x86_64) runner.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive_ext: zip
            pdfium_asset: pdfium-win-arm64.tgz

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0   # needed for vergen git SHA

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-compiling only)
        if: matrix.cross && runner.os == 'Linux'
        run: cargo install cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install pdfium
        shell: bash
        run: |
          curl -L "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}" | tar xz
          if [[ ! -d "$(pwd)/lib" ]]; then
            echo "pdfium library directory was not extracted" >&2
            exit 1
          fi
          echo "PDFIUM_DYNAMIC_LIB_PATH=$(pwd)/lib" >> $GITHUB_ENV
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$(pwd)/lib" >> $GITHUB_PATH
          fi

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Build (cross Linux)
        if: matrix.cross && runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }} --all-features

      - name: Build (cross macOS — native toolchain)
        if: matrix.cross && runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Generate shell completions (native)
        if: "!matrix.cross || runner.os == 'macOS'"
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            BIN="${BIN}.exe"
          fi
          mkdir -p completions
          "$BIN" completions bash   -o completions/shadowforge.bash
          "$BIN" completions zsh    -o completions/_shadowforge
          "$BIN" completions fish   -o completions/shadowforge.fish
          "$BIN" completions powershell -o completions/_shadowforge.ps1

      - name: Generate shell completions (cross — Linux only, runs on host)
        if: matrix.cross && runner.os == 'Linux'
        shell: bash
        run: |
          # Cross-compiled Linux binary can't run on the host; build a host binary
          mkdir -p completions
          cargo run --release -- completions bash   -o completions/shadowforge.bash
          cargo run --release -- completions zsh    -o completions/_shadowforge
          cargo run --release -- completions fish   -o completions/shadowforge.fish
          cargo run --release -- completions powershell -o completions/_shadowforge.ps1

      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          VERSION="${GITHUB_REF_NAME:-dev}"
          SAFE_VERSION="${VERSION//\//-}"
          ARCHIVE="${{ env.BINARY_NAME }}_${SAFE_VERSION}_${{ matrix.target }}.tar.gz"
          cp "$BIN" .
          tar czf "$ARCHIVE" "${{ env.BINARY_NAME }}" completions/ README.md LICENSE
          echo "ASSET=$ARCHIVE" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $BIN = "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe"
          $VERSION = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $SAFE_VERSION = $VERSION -replace '[\\/]', '-'
          $ARCHIVE = "${{ env.BINARY_NAME }}_${SAFE_VERSION}_${{ matrix.target }}.zip"
          Copy-Item $BIN .
          Compress-Archive -Path "${{ env.BINARY_NAME }}.exe","completions","README.md","LICENSE" -DestinationPath $ARCHIVE
          echo "ASSET=$ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: ${{ env.ASSET }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Dry-run publish
        run: cargo publish --package shadowforge --dry-run

      - name: Check version not already published
        id: version_check
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="shadowforge") | .version')
          if cargo search shadowforge --limit 1 2>/dev/null | grep -q "shadowforge = \"${VERSION}\""; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already on crates.io — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version_check.outputs.already_published != 'true'
        run: cargo publish --package shadowforge
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
