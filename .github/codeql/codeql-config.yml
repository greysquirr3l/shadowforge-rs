name: "shadowforge-rs CodeQL config"

# Disable the `rust/hard-coded-cryptographic-value` query.
#
# This rule has an unacceptably high false-positive rate on this codebase.
# Every alert it has ever raised (26 as of 2026-06-26) is one of:
#
#   1. A test fixture: `let key = vec![0u8; 32];` inside a `#[test]` function
#      with the fixture immediately used for a deterministic round-trip /
#      tamper / bad-length test. Test code is not production key material
#      and is in `#[cfg(test)]` modules that never ship.
#
#   2. A zero-initialised buffer that gets immediately overwritten by RNG
#      or a hash before use, e.g.:
#
#          let mut nonce = [0u8; AES_GCM_NONCE_LEN];
#          rand::rng().fill_bytes(&mut nonce);
#
#      or:
#
#          let mut nonce = [0u8; NONCE_LEN];
#          nonce.copy_from_slice(sha256_hash.get(..NONCE_LEN).unwrap_or_default());
#
#      The `[0u8; N]` form is required by the borrow checker when the fill
#      is a separate statement. CodeQL's data-flow analysis doesn't track
#      the subsequent overwrite, so it reports a "hard-coded value" that
#      is in fact never used as the value.
#
# If a future patch ever introduces an *actual* hard-coded cryptographic
# constant (an embedded IV, a baked-in key, a constant HMAC tag) it will
# be caught by:
#
#   - the Rust compiler (`unsafe_code = "forbid"` workspace lint)
#   - `cargo-deny` licence/advisory checks
#   - the `gitleaks` secret scan in CI
#   - code review against the AGENTS.md rules
#
# Re-enable this query if a real positive is ever identified.
queries:
  - exclude: rust/hard-coded-cryptographic-value