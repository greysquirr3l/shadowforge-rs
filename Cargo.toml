[workspace]
members  = ["crates/*"]
resolver = "2"

# ─── Patches ──────────────────────────────────────────────────────────────────
# Fix upstream bug in pdfium-render 0.9.2 (src/pdf/font/provider.rs:275):
# `c_char` is unsigned on aarch64-linux-gnu (and PPC, RISC-V, s390x), so the
# `as *const i8` cast mismatches the `*mut c_char` buffer and fails to compile
# with E0308. Patched on master in
# https://github.com/ajrcarey/pdfium-render/commit/095024c9a448abecfd4926d48a45be5868eacf20
# (Jun 21, 2026) but not yet released. Drop this entry when 0.9.3 ships.
[patch.crates-io]
pdfium-render = { git = "https://github.com/ajrcarey/pdfium-render", rev = "095024c9a448abecfd4926d48a45be5868eacf20" }

# ─── Workspace-wide profiles ──────────────────────────────────────────────────

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.release-with-debug]
inherits = "release"
strip    = false
debug    = true

[profile.dev]
opt-level = 1 # slightly optimised dev builds for crypto perf

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
