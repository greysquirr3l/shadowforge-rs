# cargo-deny configuration
# Run: cargo deny check
# CI: cargo deny check --hide-inclusion-graph

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
]

# ─── Advisories ───────────────────────────────────────────────────────────────
[advisories]
version      = 2
db-path      = "~/.cargo/advisory-db"
db-urls      = ["https://github.com/rustsec/advisory-db"]
ignore       = [
    # RUSTSEC-2026-0543: `chrono` is unmaintained with no fixed version.
    # It is pulled in transitively by `lopdf` and `pdfium-render`, both of
    # which we depend on for the PDF bounded context, so it cannot be
    # removed without dropping PDF support. Its own use is limited to
    # timestamp formatting for manifests and time-lock puzzles.
    { id = "RUSTSEC-2026-0543" },
    # RUSTSEC-2026-0253: `lru` 0.7.8 has a use-after-free in
    # `LruCache::pop()`, which is not panic-safe — a panicking `Drop` on a
    # cached key leaves the node linked in the LRU list. The fix is in
    # `lru` 0.18.2, which `reed-solomon-erasure` 6.0 does not accept: it
    # pins `lru = "0.7.8"`, and 0.18 is a breaking API change.
    #
    # The advisory is not reachable here. `reed-solomon-erasure` uses the
    # cache only through `put` and `get`; it never calls `pop()`, which is
    # the method the advisory describes. The unsound path cannot be
    # reached through our dependency graph.
    { id = "RUSTSEC-2026-0253" },
]
unmaintained = "workspace"
# `unsound` advisories are denied by default, but `deny.toml` did not say so
# explicitly and the default did not apply: cargo-deny reported the lockfile
# as clean while `cargo audit` flagged the same advisory as unsound. The two
# tools disagreed about the same lockfile, which is how an unreviewed advisory
# reaches a release unnoticed. Saying it explicitly makes the policy visible
# in the file, and it makes the waiver above load-bearing: if `lru` ever
# starts calling `pop()`, this stops being a waiver and becomes a bug.
unsound = "all"

# ─── Licenses ─────────────────────────────────────────────────────────────────
[licenses]
version              = 2
allow                = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions           = []

# ─── Bans ─────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards         = "allow"
deny = [
    { name = "native-tls",  reason = "Use rustls. Native TLS introduces system library variance." },
    { name = "openssl-sys", reason = "Use rustls or ring. OpenSSL is a large C attack surface." },
    { name = "async-std",   reason = "This crate is tokio-free; async-std should not appear." },
    { name = "pqcrypto",    reason = "Use ml-kem and ml-dsa (pure Rust NIST finalists)." },
    { name = "oqs",         reason = "Use ml-kem and ml-dsa (pure Rust NIST finalists)." },
    { name = "lazy_static", reason = "Use std::sync::LazyLock (stable since 1.80).", wrappers = ["sharded-slab"] },
    { name = "rand", wrappers = [], version = "<0.8" },
]
skip      = []
skip-tree = []

# ─── Sources ──────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
