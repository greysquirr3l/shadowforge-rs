[cargo]
# MSRV-aware resolver: fall back rather than hard error on incompatible deps
[resolver]
incompatible-rust-versions = "fallback"

[build]
# Use all available cores
jobs = -1

[target.'cfg(all())']
# The clippy lint policy is not here. It lives in the workspace's
# `[lints.clippy]` table in Cargo.toml, which cargo applies to every
# `cargo clippy` — CI, a contributor's clone, and the editor. A copy of
# the flags here would be a third place for the policy to drift, and it
# would only apply to the alias below.
rustflags = []

[alias]
# Quick check without full build
c = "check --workspace"
# Build all targets
b = "build --workspace"
# Test all
t = "test --workspace"
# Clippy profile used in this repository. The lint set comes from
# Cargo.toml; this only says what to check.
l = "clippy --workspace --all-features --all-targets -- -D warnings"
