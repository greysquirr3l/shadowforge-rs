    "CorpusEntry: file_hash ([u8;32]), path (String), cover_kind (CoverMediaKind), precomputed_bit_pattern (Bytes).",
    "StyloProfile: target_vocab_size (usize), target_avg_sentence_len (f64), normalize_punctuation (bool).",
    "PanicWipeConfig: key_paths (Vec<PathBuf>), config_paths (Vec<PathBuf>), temp_dirs (Vec<PathBuf>).",
    "WatermarkTripwireTag: recipient_id (Uuid), embedding_seed (Bytes). ZeroizeOnDrop on seed.",
    "Shard: index (u8), total (u8), data (Bytes), hmac_tag ([u8;32]). ZeroizeOnDrop.",
    "KeyPair: public_key (Bytes), secret_key (Bytes). ZeroizeOnDrop on secret_key.",
    "Signature: newtype over Bytes.",
    "Capacity: bytes (u64), technique (StegoTechnique). Method: is_sufficient_for(payload: &Payload) -> bool.",
    "AnalysisReport: technique, cover_capacity (Capacity), chi_square_score (f64), detectability_risk (DetectabilityRisk), recommended_max_payload_bytes (u64).",
    "DetectabilityRisk enum: Low, Medium, High.",
    "WatermarkReceipt: recipient (String), algorithm (String), shards (Vec<u8>), created_at (DateTime<Utc>). Display impl produces Markdown.",
    "ArchiveFormat enum: Zip, Tar, TarGz.",
    "PqcAlgorithm enum: MlKem1024, MlDsa87.",
    "All types derive Clone, Debug, Serialize, Deserialize where appropriate.",
    "Zero I/O crate dependencies in domain/types.rs.",
]
test_hints = [
    "Capacity::is_sufficient_for returns false when payload exceeds capacity.",
    "Payload::from_str_utf8 rejects invalid UTF-8.",
    "Shard round-trips through serde_json without data loss.",
    "WatermarkReceipt Display produces valid Markdown containing '# Watermark Receipt'.",
    "GeographicManifest serialises and deserialises cleanly.",
    "DeniableKeySet: assert secret_key is zeroed on drop via a test that checks memory.",
]
must_haves = [
    "All types in a single domain/types.rs — no duplication across bounded contexts",
    "ZeroizeOnDrop on all types touching key material",
    "No I/O crate dependencies in domain/types.rs",
    "Full serde support on all types",
    "All new nation-state countermeasure types present",
]

[[phases.tasks]]
slug       = "port-traits"
title      = "Port trait definitions in domain/ports.rs"
goal       = "Define all object-safe port traits for all bounded contexts including the new nation-state countermeasure contexts."
depends_on = ["domain-types"]
hints = [
    # Crypto ports
    "Encryptor: encapsulate(public_key) -> Result<(Bytes, Bytes), CryptoError>; decapsulate(secret_key, ciphertext) -> Result<Bytes, CryptoError>.",
    "Signer: sign(key, message) -> Result<Signature, CryptoError>; verify(key, message, sig) -> Result<bool, CryptoError>.",
