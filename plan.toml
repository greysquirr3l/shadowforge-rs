[[phases.tasks]]
slug       = "domain-types"
title      = "Canonical type vocabulary in domain/types.rs"
goal       = "Define every shared value object and entity referenced by all bounded contexts. No I/O, no external crate I/O dependencies."
depends_on = ["scaffold"]
hints = [
    "Payload: newtype over Bytes (bytes crate), ZeroizeOnDrop. Constructors: from_bytes, from_str_utf8.",
    "CoverMediaKind enum: PngImage, BmpImage, JpegImage, GifImage, WavAudio, PdfDocument, PlainText.",
    "CoverMedia: kind (CoverMediaKind), data (Bytes), metadata (HashMap<String,String>). Loading is an adapter concern.",
    "StegoTechnique enum: LsbImage, DctJpeg, Palette, LsbAudio, PhaseEncoding, EchoHiding, ZeroWidthText, PdfContentStream, PdfMetadata, CorpusSelection.",
    "EmbeddingProfile enum: Standard, Adaptive { max_detectability_db: f64 }, CompressionSurvivable { platform: PlatformProfile }, CorpusBased.",
    "PlatformProfile enum: Instagram, Twitter, Imgur, WhatsApp, Telegram, Custom { quality: u8, subsampling: ChromaSubsampling }. Add ChromaSubsampling enum: Yuv420, Yuv422, Yuv444.",
    "DistributionPattern enum: OneToOne, OneToMany { data_shards: u8, parity_shards: u8 }, ManyToOne, ManyToMany { mode: ManyToManyMode }.",
    "ManyToManyMode enum: Replicate, Stripe, Diagonal, Random.",
    "DeniableKeySet: primary_key (Bytes), decoy_key (Bytes). Both ZeroizeOnDrop.",
    "DeniablePayloadPair: real_payload (Payload), decoy_payload (Payload). ZeroizeOnDrop on both.",
